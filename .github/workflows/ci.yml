name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" — do not also set `version` here
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @supacompliant/shared build
          pnpm --filter @supacompliant/assessment-engine build
          pnpm --filter @supacompliant/control-library build
          pnpm --filter @supacompliant/framework-mappings build
          pnpm --filter @supacompliant/reporting build
          pnpm --filter @supacompliant/database build

      - name: Build apps
        run: |
          pnpm --filter @supacompliant/cli build
          pnpm --filter @supacompliant/worker build
          pnpm --filter @supacompliant/web build

      - name: Test
        run: pnpm test

      - name: RLS coverage
        run: pnpm check:rls

      - name: Install Playwright browser
        run: pnpm --filter @supacompliant/web exec playwright install chromium --with-deps

      - name: Playwright e2e
        run: pnpm --filter @supacompliant/web test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

